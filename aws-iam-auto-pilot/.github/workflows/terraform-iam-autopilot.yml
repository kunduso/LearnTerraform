name: iam-autopilot-scoped-apply

on:
  workflow_dispatch:
  push:
    branches: [ '*' ]
    paths:
      - 'aws-iam-auto-pilot/**'
      - '.github/workflows/terraform-iam-autopilot.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'aws-iam-auto-pilot/**'
      - '.github/workflows/terraform-iam-autopilot.yml'
      
  env:
  AWS_REGION: us-west-1                   # region for the demo resources and state bucket
  APPLY_POLICY_NAME: autopilot-generated  # inline policy name on the apply role (overwritten each run)
  POLICY_FILE: generated-policy.json      # reviewed policy, committed to the PR branch

permissions: read-all

jobs:
  terraform:
    name: 'continuous-integration'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Configure AWS Credentials Action For GitHub Actions
      uses: aws-actions/configure-aws-credentials@v1-node16
      with:
        role-to-assume: ${{ secrets.IAM_ROLE_GITHUB_OIDC }}
        role-session-name: AWSSession
        aws-region: us-west-2

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v1

    - name: Terraform Init
      id: init
      run: terraform init

    - name: Terraform Format
      id: fmt
      if: github.event_name == 'pull_request'
      run: terraform fmt -check

    - name: Terraform Validate
      id: validate
      if: github.event_name == 'pull_request'
      run: terraform validate -no-color

    - name: Terraform Plan
      id: plan
      if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
      run: |
        terraform plan -no-color -input=false -out=TFplan.JSON
      continue-on-error: true

    - name: Post Terraform Plan Output
      uses: actions/github-script@v6
      if: github.event_name == 'pull_request'
      env:
        PLAN: "terraform\n${{ steps.plan.outputs.stdout }}"
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const output = `#### Terraform Format and Style 🖌\`${{ steps.fmt.outcome }}\`
          #### Terraform Initialization ⚙️\`${{ steps.init.outcome }}\`
          #### Terraform Plan 📖\`${{ steps.plan.outcome }}\`
          #### Terraform Validation 🤖\`${{ steps.validate.outcome }}\`

          <details><summary>Show Plan</summary>

          \`\`\`\n
          ${process.env.PLAN}
          \`\`\`

          </details>

          *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: output
          })

    - name: Terraform Apply
      if: github.ref == 'refs/heads/main'
      run: terraform apply -auto-approve -input=false
